# PostgreSQL 16 local SOLO para las pruebas automáticas (nunca Supabase).
# Uso: docker compose -f docker-compose.test.yml up -d   (lo hace run-tests.ps1)
services:
  test-db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 15
