# =====================================================================
# ReservaYa - API Gateway
# Punto de entrada unico. No tiene base de datos: solo enruta y aplica CORS.
# =====================================================================
spring.application.name=api-gateway
server.port=${GATEWAY_PORT:8080}

# ---------------------------------------------------------------------
# Rutas hacia los microservicios
# (prefijo spring.cloud.gateway.server.webflux.* desde Spring Cloud 2025.0)
# ---------------------------------------------------------------------
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URI:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=restaurant-service
spring.cloud.gateway.server.webflux.routes[1].uri=${RESTAURANT_SERVICE_URI:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/restaurants/**

spring.cloud.gateway.server.webflux.routes[2].id=reservation-service
spring.cloud.gateway.server.webflux.routes[2].uri=${RESERVATION_SERVICE_URI:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/reservations/**

# ---------------------------------------------------------------------
# CORS: el frontend (Node estatico) corre en el puerto 3000
# ---------------------------------------------------------------------
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=${FRONTEND_ORIGIN:http://localhost:3000}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].maxAge=3600
