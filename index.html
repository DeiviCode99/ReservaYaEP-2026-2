<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Regístrate en Restaurante Doña Marta y empieza a reservar tu mesa."
    />
    <title>Restaurante Doña Marta | Crear cuenta</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="container navigation" aria-label="Navegación principal">
        <a class="brand" href="/">Restaurante Doña Marta</a>
        <a class="navigation-link" href="#contenido">Reservas</a>
      </nav>
    </header>

    <main id="contenido" class="container main-content">
      <section class="intro" aria-labelledby="titulo-principal">
        <p class="eyebrow">Sabores para recordar</p>
        <h1 id="titulo-principal">Tu mesa te está esperando.</h1>
        <p class="intro-copy">
          Crea tu cuenta en Restaurante Doña Marta y disfruta una experiencia
          especial en cada reserva.
        </p>
      </section>

      <section class="registration-panel" aria-labelledby="registro-titulo">
        <h2 id="registro-titulo">Registro</h2>
        <form id="registration-form" novalidate>
          <label for="name">Nombre</label>
          <input id="name" name="name" type="text" autocomplete="name" required />
          <p class="field-error" id="name-error"></p>

          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
          <p class="field-error" id="email-error"></p>

          <label for="password">Contraseña</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
          />
          <p class="field-hint">Mínimo 8 caracteres.</p>
          <p class="field-error" id="password-error"></p>

          <button class="button" type="submit">Crear cuenta</button>
          <p class="status" id="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <small>&copy; 2026 Restaurante Doña Marta</small>
      </div>
    </footer>

    <script src="script.js" defer></script>
  </body>
</html>
