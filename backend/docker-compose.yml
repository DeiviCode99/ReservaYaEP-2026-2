# =====================================================================
# ReservaYa - Despliegue en produccion (una sola VM)
# Uso (desde backend/, con backend/.env):  docker compose up -d --build
# Solo Caddy expone puertos (80/443); los microservicios hablan por la red
# interna de Docker usando el nombre del servicio como host.
# =====================================================================
x-service: &service
  env_file: .env
  restart: unless-stopped
  build: &build
    context: .
  environment: &env
    TZ: America/Bogota
    DJANGO_DEBUG: "false"
    AUTH_SERVICE_URI: http://auth-service:8081
    RESTAURANT_SERVICE_URI: http://restaurant-service:8082
    RESERVATION_SERVICE_URI: http://reservation-service:8083

services:
  auth-service:
    <<: *service
    build: { <<: *build, args: { SERVICE: auth_service } }
    environment: { <<: *env, PORT: "8081" }

  restaurant-service:
    <<: *service
    build: { <<: *build, args: { SERVICE: restaurant_service } }
    environment: { <<: *env, PORT: "8082" }

  reservation-service:
    <<: *service
    build: { <<: *build, args: { SERVICE: reservation_service } }
    environment: { <<: *env, PORT: "8083" }

  api-gateway:
    <<: *service
    build: { <<: *build, args: { SERVICE: gateway } }
    environment: { <<: *env, PORT: "8080" }
    depends_on: [auth-service, restaurant-service, reservation-service]

  # Construye el frontend React y lo sirve; reenvia /api/* al gateway. HTTPS automatico.
  caddy:
    build:
      context: ..
      dockerfile: backend/caddy/Dockerfile
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - caddy_data:/data
    depends_on: [api-gateway]

volumes:
  caddy_data:
