# =====================================================================
# ReservaYa - reservation-service
# Reservas, disponibilidad y cambios de estado (RF-05 a RF-12)
# =====================================================================
spring.application.name=reservation-service
server.port=${RESERVATION_SERVICE_PORT:8083}

# ---------------------------------------------------------------------
# Base de datos: PostgreSQL alojado en Supabase
# Los valores reales van en variables de entorno (ver backend/.env.example).
# NUNCA escribir la contrasena aqui: este archivo si se versiona.
# ---------------------------------------------------------------------
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Supabase limita las conexiones simultaneas y aqui hay 3 servicios conectados
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# ---------------------------------------------------------------------
# JPA / Hibernate
# validate = Hibernate NO crea ni modifica tablas; el esquema es schema.sql
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# ---------------------------------------------------------------------
# JWT (RNF-04). El secreto debe ser el MISMO en los tres servicios.
# ---------------------------------------------------------------------
reservaya.jwt.secret=${JWT_SECRET}
reservaya.jwt.issuer=${JWT_ISSUER:reservaya-auth}
reservaya.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# ---------------------------------------------------------------------
# Integracion con restaurant-service: de ahi se obtienen aforo y horarios
# de la sede para validar el cupo (RF-07) y calcular disponibilidad (RF-05).
# ---------------------------------------------------------------------
reservaya.services.restaurant-url=${RESTAURANT_SERVICE_URI:http://localhost:8082}
reservaya.services.auth-url=${AUTH_SERVICE_URI:http://localhost:8081}
reservaya.reservations.min-hours-before-cancel=${MIN_HOURS_BEFORE_CANCEL:2}

# Notificaciones por correo: sin SMTP las notificaciones quedan registradas en el log.
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
reservaya.mail.from=${MAIL_FROM:no-reply@reservaya.local}
