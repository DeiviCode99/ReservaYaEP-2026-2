# =====================================================================
# ReservaYa - restaurant-service
# Marcas, sedes y horarios (RF-03, RF-04, RF-13)
# =====================================================================
spring.application.name=restaurant-service
server.port=${RESTAURANT_SERVICE_PORT:8082}

# ---------------------------------------------------------------------
# Base de datos: PostgreSQL alojado en Supabase
# Los valores reales van en variables de entorno (ver backend/.env.example).
# NUNCA escribir la contrasena aqui: este archivo si se versiona.
# ---------------------------------------------------------------------
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Supabase limita las conexiones simultaneas y aqui hay 3 servicios conectados
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# ---------------------------------------------------------------------
# JPA / Hibernate
# validate = Hibernate NO crea ni modifica tablas; el esquema es schema.sql
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# ---------------------------------------------------------------------
# JWT (RNF-04). El secreto debe ser el MISMO en los tres servicios.
# ---------------------------------------------------------------------
reservaya.jwt.secret=${JWT_SECRET}
reservaya.jwt.issuer=${JWT_ISSUER:reservaya-auth}
reservaya.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
